[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
sc1p = { workspace = true }
scbm = { workspace = true }
synteny-tree = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["sc1p", "scbm", "synteny_tree", "schema", "_matrices"]

[tool.pyright]
include = ["packages", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "hypothesis>=6.0", "sowing>=0.1", "ruff", "pyright"]
bench = ["duckdb>=1.4", "pyarrow>=15", "tqdm>=4.66"]
